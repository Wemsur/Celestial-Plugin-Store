name: 提交内容源
description: 把你的下载源加入 Celestial 内容源商店（机器人会转成 PR）
title: "[内容源] "
labels: ["content-source-submission"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交内容源！提交后机器人会自动生成一个修改 `content-sources.json` 的 PR，
        维护者审核后合并。若信息有误，机器人会在下方留言指出，编辑本 Issue 即可重试。

        前置条件：内容源托管在 GitHub、已发布 Release，且 tag 命名为 `x.x.x` 或 `vx.x.x`。

        内容源和普通插件的区别：它只提供内容（搜索、详情、下载地址），不提供任何界面。
  - type: input
    id: id
    attributes:
      label: 内容源 id
      description: 必须和你 manifest.json 里的 id 完全一致。
      placeholder: example
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 内容源名称
      placeholder: 示例内容站
    validations:
      required: true
  - type: input
    id: github
    attributes:
      label: 仓库（owner/repo）
      description: 你内容源所在的 GitHub 仓库，格式 owner/repo。用于自动检测最新 Release。
      placeholder: Wemsur/Celestial-Content-Plugins
    validations:
      required: true
  - type: input
    id: download
    attributes:
      label: 下载直链
      description: 指向打包 zip 的 https 直链。推荐用「永远指向最新 Release」的重定向直链。
      placeholder: https://github.com/Wemsur/Celestial-Content-Plugins/releases/latest/download/example-0.1.0.zip
    validations:
      required: true
  - type: dropdown
    id: contentTypes
    attributes:
      label: 提供的内容类型
      description: |
        可多选。填 manifest.json 里的机器名，对应关系：
        mod=模组、modpack=整合包、resourcepack=资源包、shader=光影、
        datapack=数据包、world=世界、skin=皮肤。
      multiple: true
      options:
        - mod
        - modpack
        - resourcepack
        - shader
        - datapack
        - world
        - skin
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: 作者
      placeholder: 你的名字
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: 简介
      description: 一句话说明这个源提供什么内容。
    validations:
      required: false
  - type: input
    id: tags
    attributes:
      label: 标签
      description: 逗号分隔，例如：中文, 地图
      placeholder: 地图
    validations:
      required: false
